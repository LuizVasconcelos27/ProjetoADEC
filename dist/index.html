
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Gerenciador de Tarefas</title>
  <script type="module" crossorigin src="/assets/index-DCsr1w_S.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CCB-JJ2n.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>TaskFlow</h1>
            <p>Organize suas tarefas e acompanhe seu progresso.</p>
        </header>

        <section class="task-card">
            <h2>Minhas tarefas</h2>

            <form id="task-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Digite uma nova tarefa..."
                    autocomplete="off"
                >
                <button type="submit">Adicionar</button>
            </form>

            <div class="task-info">
                <span id="task-count">0 tarefas pendentes</span>
            </div>

            <ul id="task-list"></ul>

            <p id="empty-message">Nenhuma tarefa por aqui. Adicione a primeira!</p>
        </section>

        <footer>
            <p>TaskFlow — Organização simples para o seu dia.</p>
        </footer>
    </main>

</body>
</html>
